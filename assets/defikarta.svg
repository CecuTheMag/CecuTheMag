20 0 0 1 40,0 c0,10 -6,18 -20,34z" fill="#ff4d5e"/><path d="M464,60 h12 M470,54 v12" stroke="#fff" stroke-width="3" stroke-linecap="round"/><text class="m" x="30" y="150" font-size="11" fill="#8b949e">nearest AED  ·  call 112  ·  100–120 compressions / min</text><rect x="470.4" y="18" width="112" height="26" rx="13" fill="#07090d" fill-opacity=".85" stroke="#ff4d5e" stroke-opacity=".6"/><text class="m" x="482.4" y="35.5" font-size="12" font-weight="600" fill="#ff4d5e">Идейник 2026</text><text class="m" x="30" y="208" font-size="11.5" letter-spacing="2.5" fill="#ff4d5e">03  /  EMERGENCY RESPONSE</text><text class="s" x="28" y="248" font-size="32" font-weight="700" fill="#e6edf3" letter-spacing="-.8">ДефиКарта</text><text class="s" x="30" y="278" font-size="15" fill="#8b949e">Finds the nearest defibrillator, gets you to call 112,</text><text class="s" x="30" y="300" font-size="15" fill="#8b949e">and counts you through CPR. Nearby trained</text><text class="s" x="30" y="322" font-size="15" fill="#8b949e">responders get paged from a dispatcher console.</text><rect x="30" y="336" width="51" height="24" rx="12" fill="#ff4d5e" fill-opacity=".08" stroke="#ff4d5e" stroke-opacity=".35"/><text class="m" x="41" y="352" font-size="12" fill="#ff4d5e">Expo</text><rect x="89.2" y="336" width="58" height="24" rx="12" fill="#ff4d5e" fill-opacity=".08" stroke="#ff4d5e" stroke-opacity=".35"/><text class="m" x="100.2" y="352" font-size="12" fill="#ff4d5e">React</text><rect x="155.7" y="336" width="44" height="24" rx="12" fill="#ff4d5e" fill-opacity=".08" stroke="#ff4d5e" stroke-opacity=".35"/><text class="m" x="166.7" y="352" font-size="12" fill="#ff4d5e">PWA</text><rect x="207.6" y="336" width="44" height="24" rx="12" fill="#ff4d5e" fill-opacity=".08" stroke="#ff4d5e" stroke-opacity=".35"/><text class="m" x="218.6" y="352" font-size="12" fill="#ff4d5e">OSM</text></g><rect x=".5" y=".5" width="599" height="379" rx="18" fill="none" stroke="#1c2330"/><filter id="cb" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="3"/></filter><rect x=".75" y=".75" width="598.5" height="378.5" rx="18" fill="none" pathLength="100" stroke-dasharray="9 91" stroke-linecap="round" stroke="#ff4d5e" stroke-width="4" stroke-opacity=".7" filter="url(#cb)"><animate attributeName="stroke-dashoffset" values="0;-100" dur="8s" begin="-5.1s" repeatCount="indefinite"/></rect><rect x=".75" y=".75" width="598.5" height="378.5" rx="18" fill="none" pathLength="100" stroke-dasharray="9 91" stroke-linecap="round" stroke="#ff4d5e" stroke-width="1.5"><animate attributeName="stroke-dashoffset" values="0;-100" dur="8s" begin="-5.1s" repeatCount="indefinite"/></rect></svg>
