 font-size="60" font-weight="700" fill="url(#hl)" letter-spacing="-1.5">with no servers.</text><text class="s rot" style="animation-delay:3s" x="70" y="252" font-size="60" font-weight="700" fill="url(#hl)" letter-spacing="-1.5">from idle browsers.</text><text class="s rot" style="animation-delay:6s" x="70" y="252" font-size="60" font-weight="700" fill="url(#hl)" letter-spacing="-1.5">that save lives.</text><text class="s rot" style="animation-delay:9s" x="70" y="252" font-size="60" font-weight="700" fill="url(#hl)" letter-spacing="-1.5">people pay for.</text><text class="s" x="72" y="312" font-size="19" fill="#8b949e">Encrypted networks, distributed compute, and products that ship.</text><text class="s" x="72" y="340" font-size="19" fill="#8b949e">Built end to end: protocol, apps, infra, and the pitch.</text><rect x="72" y="364" width="8" height="8" rx="4" fill="#22c55e"><animate attributeName="opacity" values="1;.25;1" dur="2s" repeatCount="indefinite"/></rect><text class="m" x="90" y="372" font-size="13" fill="#8b949e">currently shipping  Kant 0.6  ·  Swarm  ·  ДефиКарта</text></g><rect x=".5" y=".5" width="1199" height="419" rx="20" fill="none" stroke="#1c2330"/></svg>
