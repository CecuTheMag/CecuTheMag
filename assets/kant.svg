e">in the middle. Device to device over libp2p; relays</text><text class="s" x="30" y="322" font-size="15" fill="#8b949e">forward ciphertext they can't read.</text><rect x="30" y="336" width="66" height="24" rx="12" fill="#4f8ef7" fill-opacity=".08" stroke="#4f8ef7" stroke-opacity=".35"/><text class="m" x="41" y="352" font-size="12" fill="#4f8ef7">libp2p</text><rect x="103.8" y="336" width="175" height="24" rx="12" fill="#4f8ef7" fill-opacity=".08" stroke="#4f8ef7" stroke-opacity=".35"/><text class="m" x="114.8" y="352" font-size="12" fill="#4f8ef7">X3DH + Double Ratchet</text><rect x="287.09999999999997" y="336" width="102" height="24" rx="12" fill="#4f8ef7" fill-opacity=".08" stroke="#4f8ef7" stroke-opacity=".35"/><text class="m" x="298.09999999999997" y="352" font-size="12" fill="#4f8ef7">5 platforms</text></g><rect x=".5" y=".5" width="599" height="379" rx="18" fill="none" stroke="#1c2330"/><filter id="cb" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="3"/></filter><rect x=".75" y=".75" width="598.5" height="378.5" rx="18" fill="none" pathLength="100" stroke-dasharray="9 91" stroke-linecap="round" stroke="#4f8ef7" stroke-width="4" stroke-opacity=".7" filter="url(#cb)"><animate attributeName="stroke-dashoffset" values="0;-100" dur="8s" begin="-1.7s" repeatCount="indefinite"/></rect><rect x=".75" y=".75" width="598.5" height="378.5" rx="18" fill="none" pathLength="100" stroke-dasharray="9 91" stroke-linecap="round" stroke="#4f8ef7" stroke-width="1.5"><animate attributeName="stroke-dashoffset" values="0;-100" dur="8s" begin="-1.7s" repeatCount="indefinite"/></rect></svg>
